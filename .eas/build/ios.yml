build:
  name: LifeSwap iOS (Capacitor)
  steps:
    - eas/checkout

    - eas/install_node_modules

    # dist/ and ios/App/App/public/ are gitignored, so the web app is not in the
    # uploaded archive. Build it here on the worker.
    - run:
        name: Build web assets and sync into Xcode project
        command: bash scripts/eas/build-web.sh

    # Installs the distribution cert + provisioning profile into the worker
    # keychain using the credentials EAS manages for this project.
    - eas/configure_ios_credentials

    # Logic lives in a script, not inline YAML: EAS interpolates a run step's
    # whole command string before bash runs, so embedded shell is fragile.
    # Both scripts are syntax-checked and dry-run by `npm run verify:ios`.
    - run:
        name: Archive and export IPA
        command: bash scripts/eas/archive-ios.sh

    - eas/upload_artifact:
        name: Upload IPA
        inputs:
          type: application-archive
          path: ios/App/output/*.ipa
